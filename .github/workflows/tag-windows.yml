name: Tag Windows

# Build the classic Windows installer when a v* tag is pushed, and attach the
# zip and setup.exe to that tag's GitHub Release. Same shape as the Android
# fork's tag-apk workflow. The installer is unsigned.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: tag-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      # All subprojects share one virtualenv. Poetry's parallel installer can
      # race while replacing the same dependency from different lock files.
      POETRY_INSTALLER_PARALLEL: "false"
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Windows packaging tools
        run: choco install innosetup make -y --no-progress

      - name: Install Poetry
        run: python -m pip install poetry==2.2.1

      - name: Build and package
        run: |
          python -m venv venv
          source venv/Scripts/activate
          poetry install
          make build
          python scripts/package/normalize-fork-version.py
          make package

      - name: Publish the installer on the tag
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
